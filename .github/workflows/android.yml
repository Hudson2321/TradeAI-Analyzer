name: Compilar TradeAI Analyzer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extrair projeto
        run: unzip TradeAI_Analyzer_GitHub.zip

      - name: Compilar APK
        working-directory: TradeAI_Analyzer_Android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: TradeAI-Analyzer-APK
          path: TradeAI_Analyzer_Android/app/build/outputs/apk/debug/*.apk
